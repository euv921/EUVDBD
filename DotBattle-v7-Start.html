<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dot Battle</title><style>
*{box-sizing:border-box}body{margin:0;background:#14233b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:manipulation}button,select{font:inherit}button{border:0;cursor:pointer}.app{height:100dvh;min-height:440px;display:flex;flex-direction:column;padding:8px;gap:7px}.top{display:flex;justify-content:space-between;align-items:center;gap:6px}.top button{background:#314666;color:white;padding:8px 12px;border-radius:10px}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.settings label{font-size:13px}.settings select{border:0;border-radius:8px;padding:7px;background:#fff;color:#17243b}.board{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(70px,1fr) minmax(165px,2.3fr) minmax(70px,1fr);gap:7px;flex:1;min-height:0}.player{background:#2c4160;border:3px solid transparent;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.player b{font-size:clamp(14px,2.7vw,24px)}.score{font-size:clamp(20px,3.5vw,34px);font-weight:800}.player button{background:#ffba52;color:#17243b;border-radius:11px;padding:8px 15px;font-weight:800;min-width:55%}.player button:disabled{background:#6d7787;color:#c9ced6}.player.active{border-color:#ffd15c;background:#435372}.player.locked{opacity:.5}.center{grid-column:1/3;background:#fffaf0;color:#17243b;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:7px;gap:3px;min-height:0}.status{text-align:center;font-size:clamp(14px,2.4vw,22px);font-weight:800}.timer{color:#d83232;font-size:1.4em}.dots{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%}.dots svg{width:100%;height:100%}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.controls button{padding:10px 18px;border-radius:10px;background:#284b7d;color:white;font-weight:800}.controls .correct{background:#16864e}.controls .wrong{background:#c53d3d}.hidden{display:none!important}.note{text-align:center;font-size:11px;opacity:.85}.end{position:fixed;inset:0;background:#14233bf5;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;padding:20px}.end h1{font-size:clamp(30px,7vw,60px)}.end button{background:#ffba52;padding:14px 32px;border-radius:12px;font-weight:800;font-size:20px}.warning{color:#ffe38c;font-size:12px}.center .hint{font-size:12px;color:#546176;text-align:center}@media(orientation:landscape){.app{min-height:340px}.board{grid-template-rows:minmax(50px,1fr) minmax(130px,2.2fr) minmax(50px,1fr)}.player{flex-direction:row;gap:9px}.player button{min-width:0}.player b{font-size:15px}.score{font-size:24px}.center{padding:4px}.status{font-size:17px}.note{font-size:10px}}
</style></head><body><main class="app"><header class="top"><strong>⭐ Dot Battle</strong><div><span id="roundLabel">Round 1 / 20</span> <button id="restart">Start</button></div></header><section class="settings"><label>Players <select id="count"><option>2</option><option>3</option><option selected>4</option></select></label><label>Judge <select id="judge"><option value="human">Human Judge</option><option value="voice">Voice Judge (English)</option></select></label><label>Style <select id="style"><option value="rainbow">🌈 Rainbow</option><option value="random">🎨 Solid Color</option><option value="stars">⭐ Stars</option><option value="surprise">🎁 Surprise</option><option value="halloween">🎃 Halloween</option></select></label><label>Max <select id="max"><option>20</option><option>50</option><option selected>100</option></select></label></section><div id="warning" class="warning hidden"></div><section class="board"><div class="player" id="p0"><b>Player 1</b><span class="score">0</span><button data-player="0">BUZZ!</button></div><div class="player" id="p1"><b>Player 2</b><span class="score">0</span><button data-player="1">BUZZ!</button></div><div class="center"><div id="status" class="status">Count the shapes!</div><div id="dots" class="dots"></div><div class="hint" id="hint"></div><div class="controls"><button id="correct" class="correct hidden">✓ Correct +1</button><button id="wrong" class="wrong hidden">✕ Wrong −1</button></div></div><div class="player" id="p2"><b>Player 3</b><span class="score">0</span><button data-player="2">BUZZ!</button></div><div class="player" id="p3"><b>Player 4</b><span class="score">0</span><button data-player="3">BUZZ!</button></div></section><footer class="note" id="note">Human Judge: After 2 seconds, choose Correct or Wrong. Voice Judge: Say the answer in English within 2 seconds.</footer></main><div class="end hidden" id="end"><h1 id="winner"></h1><div id="results"></div><button id="again">Play Again</button></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;let count=4,max=100,round=1,total=20,number=0,layout,scores=[0,0,0,0],locked=new Set(),active=-1,finished=false,phase='ready',deadline=0,timer=null,recognizer=null,attempt=0,heard='',roundTransition=null,started=false;const palette=['#e74c3c','#f39c12','#eab308','#16a34a','#2563eb','#9333ea'];const pick=n=>Math.floor(Math.random()*n);let cardShape='circle',cardColor='rainbow',cardEmoji='🎃';const halloweenEmojis=['🎃','👻','🦇','🕷️','💀','🍬','🍭','🧙','🧛','🧟','🕸️'];function chooseCardStyle(){let mode=$('style').value;cardShape=mode==='halloween'?'emoji':mode==='stars'?'star':mode==='surprise'?['circle','star','heart'][pick(3)]:'circle';if(mode==='halloween')cardEmoji=halloweenEmojis[pick(halloweenEmojis.length)];cardColor=mode==='rainbow'?'rainbow':mode==='stars'?'#f5b82e':palette[pick(palette.length)];if(mode==='surprise'&&pick(3)===0)cardColor='rainbow'}function createLayout(n){let opts=[];for(let cols=2;cols<=Math.min(12,n);cols++){let rows=Math.floor(n/cols),rem=n%cols;if(rows>=2&&rows<=12)opts.push({rows,cols,rem})}let base=opts.length?opts[pick(opts.length)]:{rows:1,cols:n,rem:0};let vertical=pick(2)===0;let full=base.rows,span=base.cols,rem=base.rem;let shortAt=rem?pick(full+1):0;let align=pick(3);return {vertical,full,span,rem,shortAt,align}}function symbol(x,y,r,shape,fill){if(shape==='emoji')return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="19">${cardEmoji}</text>`;if(shape==='circle')return `<circle cx="${x}" cy="${y}" r="${r*.7}" fill="${fill}"/>`;if(shape==='star'){let pts=[];for(let j=0;j<10;j++){let a=-Math.PI/2+j*Math.PI/5,rr=j%2?r*.42:r;pts.push(`${x+rr*Math.cos(a)},${y+rr*Math.sin(a)}`)}return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`}return `<path d="M ${x} ${y+r*.75} C ${x-r*1.7} ${y-r*.25}, ${x-r*.65} ${y-r*1.3}, ${x} ${y-r*.45} C ${x+r*.65} ${y-r*1.3}, ${x+r*1.7} ${y-r*.25}, ${x} ${y+r*.75} Z" fill="${fill}"/>`}function draw(){let {vertical,full,span,rem,shortAt,align}=layout;let major=full+(rem?1:0),minor=span;let columns=vertical?major:minor,rows=vertical?minor:major,w=columns*24+24,h=rows*24+24,shape=cardShape,color=cardColor,s='',index=0;for(let line=0;line<major;line++){let short=rem&&line===shortAt,len=short?rem:span,offset=short?(align===0?0:align===1?Math.floor((span-rem)/2):span-rem):0;for(let j=0;j<len;j++){let col=vertical?line:j+offset,row=vertical?j+offset:line,fill=color==='rainbow'?palette[(col+row)%palette.length]:color;s+=symbol(24+col*24,22+row*24,9,shape,fill);index++}}$('dots').innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${number} organized shapes to count">${s}</svg>`}function update(){for(let i=0;i<4;i++){let el=$('p'+i);el.classList.toggle('hidden',i>=count);el.classList.toggle('active',active===i);el.classList.toggle('locked',locked.has(i));el.querySelector('.score').textContent=scores[i];el.querySelector('button').disabled=!started||finished||active!==-1||locked.has(i)||i>=count}let human=$('judge').value==='human';$('correct').classList.toggle('hidden',!(human&&phase==='human-judge'));$('wrong').classList.toggle('hidden',!(human&&phase==='human-judge'));$('roundLabel').textContent=`Round ${round} / ${total}`;$('hint').textContent=phase==='human-judge'?'Judge: Did the player answer correctly?':phase==='listening'?'Listening for an English number…':''}function stopTimer(){if(timer!==null){clearInterval(timer);timer=null}}function stopSpeech(){let old=recognizer;recognizer=null;if(old){old.onresult=null;old.onerror=null;old.onend=null;try{old.abort()}catch(e){}}}function stopAll(){stopTimer();stopSpeech();attempt++;if(roundTransition!==null){clearTimeout(roundTransition);roundTransition=null}}function autoAdvance(){roundTransition=setTimeout(()=>{roundTransition=null;next()},650)}function fail(reason){if(active<0)return;let p=active;stopAll();scores[p]--;locked.add(p);active=-1;if(locked.size>=count){finished=true;phase='finished';$('status').textContent=`${reason}. Everyone tried! Answer: ${number}`;autoAdvance()}else{phase='ready';$('status').textContent=`Player ${p+1}: ${reason} (−1). Others can buzz!`}update()}function correct(){if(active<0)return;let p=active;stopAll();scores[p]++;active=-1;finished=true;phase='finished';$('status').textContent=`Player ${p+1} is correct! Answer: ${number} (+1)`;update();autoAdvance()}
const units={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19},tens={twenty:20,thirty:30,forty:40,fourty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};function parseNumber(raw){let s=raw.toLowerCase().replace(/[,.-]/g,' ').replace(/\band\b/g,' ').replace(/\b(a|the|answer|is|it's|its|equals|equal|to|there|are|i|think)\b/g,' ').trim();let digits=s.match(/\b(?:100|[1-9]?\d)\b/);if(digits)return Number(digits[0]);let words=s.split(/\s+/).filter(Boolean);for(let i=0;i<words.length;i++){if(words[i]==='hundred'&&i>0&&words[i-1]==='one')return 100;if(units[words[i]]!==undefined)return units[words[i]];if(tens[words[i]]!==undefined)return tens[words[i]]+(units[words[i+1]]??0)}return null}function beginVoice(i,token){if(!SpeechAPI){$('warning').textContent='Speech recognition is unavailable in this browser. Please choose Human Judge.';$('warning').classList.remove('hidden');fail('Speech recognition unavailable');return}let rec;try{rec=new SpeechAPI();rec.lang='en-US';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;recognizer=rec;rec.onresult=e=>{if(token!==attempt||active!==i||phase!=='listening')return;for(let k=e.resultIndex;k<e.results.length;k++){let res=e.results[k];for(let a=0;a<res.length;a++){let transcript=res[a].transcript,parsed=parseNumber(transcript);if(parsed===null)continue;heard=transcript;if(parsed===number){correct();return}if(res.isFinal){fail(`Wrong answer: “${transcript}”`);return}}}};rec.onerror=e=>{if(token!==attempt||active!==i)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopAll();active=-1;phase='ready';$('warning').textContent='Microphone access denied. Allow microphone access or switch to Human Judge.';$('warning').classList.remove('hidden');$('status').textContent='Microphone permission needed. No points deducted.';update()}else if(e.error==='audio-capture'){stopAll();active=-1;phase='ready';$('status').textContent='Microphone unavailable. No points deducted.';update()}};rec.onend=()=>{if(token===attempt&&active===i&&phase==='listening'&&performance.now()>=deadline)fail('Time up')};rec.start()}catch(e){stopAll();active=-1;phase='ready';$('warning').textContent='Voice recognition could not start. Use HTTPS and allow microphone access, or choose Human Judge.';$('warning').classList.remove('hidden');$('status').textContent='Voice recognition unavailable. No points deducted.';update()}}
function buzz(i){if(!started||finished||active!==-1||locked.has(i)||i>=count)return;active=i;phase=$('judge').value==='voice'?'listening':'countdown';heard='';deadline=performance.now()+2000;let token=++attempt;update();if(phase==='listening')beginVoice(i,token);function tick(){if(active!==i||token!==attempt)return;let left=Math.max(0,deadline-performance.now());$('status').innerHTML=`Player ${i+1} buzzed! <span class="timer">${(left/1000).toFixed(1)}s</span>`;if(left<=0){stopTimer();if($('judge').value==='human'){phase='human-judge';$('status').textContent=`Player ${i+1} — Judge the answer`;update()}else fail('Time up')}}tick();if(active===i)timer=setInterval(tick,40)}function newRound(){stopAll();started=true;active=-1;locked=new Set();finished=false;phase='ready';number=1+pick(max);layout=createLayout(number);chooseCardStyle();draw();$('status').textContent='Count the shapes — buzz first!';update()}function next(){if(!finished)return;if(round>=total){showEnd();return}round++;newRound()}function showEnd(){stopAll();let best=Math.max(...scores.slice(0,count)),winners=scores.slice(0,count).map((s,i)=>s===best?`Player ${i+1}`:null).filter(Boolean);$('winner').textContent=winners.join(' & ')+(winners.length>1?' tie! 🏆':' wins! 🏆');$('results').innerHTML=scores.slice(0,count).map((s,i)=>`<p>Player ${i+1}: ${s} points</p>`).join('');$('end').classList.remove('hidden')}function restart(){stopAll();started=false;count=Number($('count').value);max=Number($('max').value);scores=[0,0,0,0];round=1;active=-1;locked=new Set();finished=false;phase='waiting';$('end').classList.add('hidden');$('dots').innerHTML='';$('status').textContent='Ready to play?';$('hint').textContent='Press Start to reveal the first card.';$('restart').textContent='Start';update();$('hint').textContent='Press Start to reveal the first card.'}function start(){if(started){restart();return}count=Number($('count').value);max=Number($('max').value);$('restart').textContent='Restart';newRound()}function modeChanged(){stopAll();$('warning').classList.add('hidden');if($('judge').value==='voice'&&!SpeechAPI){$('warning').textContent='Voice recognition is not supported here. Try Safari with HTTPS, or use Human Judge.';$('warning').classList.remove('hidden')}restart()}document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>buzz(Number(b.dataset.player))));$('correct').addEventListener('click',correct);$('wrong').addEventListener('click',()=>fail('Wrong answer'));$('restart').addEventListener('click',start);$('again').addEventListener('click',restart);$('count').addEventListener('change',restart);$('max').addEventListener('change',restart);$('judge').addEventListener('change',modeChanged);$('style').addEventListener('change',()=>{if(started){chooseCardStyle();draw()}});restart()})();
</script></body></html>
