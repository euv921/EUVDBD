name: Update Game Index

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'scripts/update_game_index.py'
      - '.github/workflows/update-game-index.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-game-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and commit catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_game_index.py
            if git diff --quiet -- games.json; then
              echo "games.json unchanged"
              exit 0
            fi
            git add games.json
            git commit -m "chore: auto-update games.json"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed; regenerate from latest main (attempt $attempt/3)"
          done
          echo "Unable to push catalog after three attempts" >&2
          exit 1

      # Commits made with GITHUB_TOKEN do not trigger Pages builds themselves.
      # Keep the existing main / root publishing source and explicitly rebuild it.
      - name: Rebuild GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
