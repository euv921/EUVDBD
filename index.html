<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EUVDBD Game Library</title>
<style>
:root{
  --bg:#0f1929;--card:#1a2b45;--accent:#ffba52;--accent2:#16864e;
  --text:#fff;--muted:#8a9bb5;--border:#2a3f5f;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;padding:48px 20px 32px}
header h1{font-size:clamp(28px,5vw,48px);font-weight:800;background:linear-gradient(135deg,var(--accent),#ff6b6b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);font-size:clamp(14px,2vw,18px);margin-top:8px}
main{width:100%;max-width:900px;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.3);border-color:var(--accent)}
.card .emoji{font-size:40px;line-height:1}
.card .title{font-size:20px;font-weight:700}
.card .desc{font-size:14px;color:var(--muted);line-height:1.5}
.card .play{font-size:13px;color:var(--accent);font-weight:600;margin-top:auto}
.hidden{display:none!important}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:15px}
footer{color:var(--muted);font-size:12px;padding:20px;text-align:center}
</style>
</head>
<body>
<header>
<h1>🎪 EUVDBD Game Library</h1>
<p>A collection of browser games — pick one and play!</p>
</header>
<main>
<div id="grid" class="grid" aria-label="Games"></div>
<noscript><p class="empty">Enable JavaScript to view the game catalog.</p></noscript>
<div id="empty" role="status" class="empty hidden">No games found. Check back soon!</div>
</main>
<footer>Powered by GitHub Pages · Games auto-discovered via GitHub Actions</footer>
<script>
(async function(){
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  try{
    const res=await fetch('./games.json?_='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const games=await res.json();
    if(!Array.isArray(games))throw new Error('Invalid catalog');
    const validGames=games.filter(g=>g&&typeof g.slug==='string'&&/^[a-z0-9][a-z0-9-]*$/.test(g.slug));
    if(!validGames.length){empty.classList.remove('hidden');return}
    validGames.forEach(function(g){
      const card=document.createElement('a');
      card.className='card';
      card.href='./games/'+g.slug+'/';
      const emoji=document.createElement('span');
      emoji.className='emoji';
      emoji.textContent=g.emoji||'\ud83c\udfae';
      const title=document.createElement('span');
      title.className='title';
      title.textContent=g.title||g.slug;
      const desc=document.createElement('span');
      desc.className='desc';
      desc.textContent=g.description||'A browser game.';
      const play=document.createElement('span');
      play.className='play';
      play.textContent='Play \u2192';
      card.appendChild(emoji);
      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(play);
      grid.appendChild(card);
    });
  }catch(e){
    empty.textContent='Could not load game catalog. Please refresh.';
    empty.classList.remove('hidden');
    console.error(e);
  }
})();
</script>
</body>
</html>
