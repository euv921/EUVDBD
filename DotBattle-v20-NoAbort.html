</style></head><body><main class="app"><header class="top"><strong>⭐ Dot Battle</strong><div><span id="roundLabel">Round 1 / 20</span> <button id="restart">Start</button></div></header><div id="heardHeader" class="heard-header hidden" aria-live="polite"></div><section class="settings"><label>Players <select id="count"><option>2</option><option>3</option><option selected>4</option></select></label><label class="judge-picker">Judge <button type="button" id="judgeButton" aria-pressed="false" aria-label="Enable Voice Judge"><span>🎤 Voice Judge</span><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span><span class="switch-state">OFF</span></button><select id="judge" class="hidden" aria-label="Judge mode"><option value="human">Human Judge</option><option value="voice">Voice Judge</option></select></label><label>Style <select id="style"><option value="rainbow">🌈 Rainbow</option><option value="random">🎨 Solid Color</option><option value="stars">⭐ Stars</option><option value="surprise">🎁 Surprise</option><option value="halloween">🎃 Halloween</option></select></label><label>Max <select id="max"><option>20</option><option>50</option><option selected>100</option></select></label></section><div id="warning" class="warning hidden"></div><section class="board"><div class="player" id="p0"><b>Player 1</b><span class="score">0</span><button data-player="0">BUZZ!</button></div><div class="player" id="p1"><b>Player 2</b><span class="score">0</span><button data-player="1">BUZZ!</button></div><div class="center"><div id="status" class="status">Count the shapes!</div><div id="dots" class="dots"></div><div class="hint" id="hint"></div><div class="controls"><button id="correct" class="correct hidden">✓ Correct +1</button><button id="wrong" class="wrong hidden">✕ Wrong −1</button></div></div><div class="player" id="p2"><b>Player 3</b><span class="score">0</span><button data-player="2">BUZZ!</button></div><div class="player" id="p3"><b>Player 4</b><span class (()=>{'use strict';const $=id=>document.getElementById(id),SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;let count=4,max=100,round=1,total=20,number=0,layout,scores=[0,0,0,0],locked=new Set(),active=-1,finished=false,phase='ready',deadline=0,timer=null,recognizer=null,attempt=0,heard='',roundTransition=null,started=false,processingTimer=null,voiceCandidates=[],voiceReady=false,voiceSession=0,voiceCutoff=false,voiceWindowStart=0,voiceFallback=false;const palette=['#e74c3c','#f39c12','#eab308','#16a34a','#2563eb','#9333ea'];const pick=n=>Math.floor(Math.random()*n);let cardShape='circle',cardColor='rainbow',cardEmoji='🎃';const halloweenEmojis=['🎃','👻','🦇','🕷️','💀','🍬','🍭','🧙','🧛','🧟','🕸️'];function chooseCardStyle(){let mode=$('style').value;cardShape=mode==='halloween'?'emoji':mode==='stars'?'star':mode==='surprise'?['circle','star','heart'][pick(3)]:'circle';if(mode==='halloween')cardEmoji=halloweenEmojis[pick(halloweenEmojis.length)];cardColor=mode==='rainbow'?'rainbow':mode==='stars'?'#f5b82e':palette[pick(palette.length)];if(mode==='surprise'&&pick(3)===0)cardColor='rainbow'}function createLayout(n){let opts=[];for(let cols=2;cols<=Math.min(12,n);cols++){let rows=Math.floor(n/cols),rem=n%cols;if(rows>=2&&rows<=12)opts.push({rows,cols,rem})}let base=opts.length?opts[pick(opts.length)]:{rows:1,cols:n,rem:0};let vertical=pick(2)===0;let full=base.rows,span=base.cols,rem=base.rem;let shortAt=rem?pick(full+1):0;let align=pick(3);return {vertical,full,span,rem,shortAt,align}}function symbol(x,y,r,shape,fill){if(shape==='emoji')return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="19">${cardEmoji}</text>`;if(shape==='circle')return `<circle cx="${x}" cy="${y}" r="${r*.7}" fill="${fill}"/>`;if(shape==='star'){let pts=[];for(let j=0;j<10;j++){let a=-Math.PI/2+j*Math.PI/5,rr=j%2?r*.42:r;pts.push(`${x+rr*Math.cos(a)},${y+rr*Math.sin(a)}`)}return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`}return `<path d=" const units={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19},tens={twenty:20,thirty:30,forty:40,fourty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};function parseNumber(raw){let s=raw.toLowerCase().replace(/[,.-]/g,' ').replace(/\band\b/g,' ').replace(/\b(a|the|answer|is|it's|its|equals|equal|to|there|are|i|think)\b/g,' ').trim();let digits=s.match(/\b(?:100|[1-9]?\d)\b/);if(digits)return Number(digits[0]);let words=s.split(/\s+/).filter(Boolean);for(let i=0;i<words.length;i++){if(words[i]==='hundred'&&i>0&&words[i-1]==='one')return 100;if(tens[words[i]]!==undefined)return tens[words[i]]+(units[words[i+1]]??0);if(units[words[i]]!==undefined)return units[words[i]]}return null}// v14: prepare speech before revealing the question; use the latest result.
